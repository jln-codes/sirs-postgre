[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digues-webapp"
version = "0.1.0"
description = "Application web pour digues.app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
sirs-index-knowledge = "digues_webapp.knowledge.indexer:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["digues_webapp*"]
